name: Validate DSI plugin
on:
  push:
    paths: ['skills/**', 'sources.json', 'collections.json', 'plugins/**', 'scripts/**', 'tests/**', '*index.json', '*resources.json', 'resource-report.json', 'package*.json', '.gitattributes', '.agents/**', '.github/workflows/validate-plugin.yml']
  pull_request:
    paths: ['skills/**', 'sources.json', 'collections.json', 'plugins/**', 'scripts/**', 'tests/**', '*index.json', '*resources.json', 'resource-report.json', 'package*.json', '.gitattributes', '.agents/**', '.github/workflows/validate-plugin.yml']
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
